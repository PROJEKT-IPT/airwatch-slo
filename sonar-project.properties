# Static project metadata is kept here. Project identity is passed by CI.
sonar.projectName=AirWatch SLO
sonar.sourceEncoding=UTF-8

sonar.sources=backend,data_pipeline/scripts,frontend/src
sonar.tests=backend/tests,data_pipeline/tests,frontend/tests

sonar.python.version=3.11
sonar.python.coverage.reportPaths=backend/coverage.xml,data_pipeline/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Translation tables repeat the same keys per language by design; that is not
# real copy-paste, so keep them out of duplication detection.
sonar.cpd.exclusions=frontend/src/i18n.jsx

sonar.exclusions=\
  **/__pycache__/**,\
  **/.pytest_cache/**,\
  **/.venv/**,\
  **/tests/**,\
  **/node_modules/**,\
  **/dist/**,\
  frontend/dist-e2e/**,\
  frontend/test-results/**,\
  data_pipeline/outputs/**,\
  data_pipeline/sample_data/**,\
  data_pipeline/reference_data/regions/raw/**,\
  database/diagrams/**/*.png

sonar.coverage.exclusions=\
  **/tests/**,\
  backend/alembic/**,\
  backend/scripts/**,\
  data_pipeline/scripts/inspect_*.py,\
  data_pipeline/scripts/get_copernicus_token.py,\
  data_pipeline/scripts/search_s5p_no2_products.py,\
  frontend/vite.config.js,\
  frontend/src/main.jsx,\
  frontend/src/api/airwatchApi.js,\
  frontend/src/components/SatelliteCard.jsx
