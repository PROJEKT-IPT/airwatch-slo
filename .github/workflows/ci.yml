name: CI

on:
  push:
  pull_request:

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check forbidden tracked files
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env must not be tracked"
            exit 1
          fi

          forbidden_files="$(git ls-files '*.nc' 'data/**/*.zip' 'data/**/*.tif' 'data/**/*.tiff' 'data/**/*.h5' 'data_pipeline/**/*.zip' 'data_pipeline/**/*.tif' 'data_pipeline/**/*.tiff' 'data_pipeline/**/*.h5')"
          if [ -n "$forbidden_files" ]; then
            echo "::error::Forbidden large data files are tracked:"
            echo "$forbidden_files"
            exit 1
          fi

          echo "Repository safety checks passed."

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Compile backend Python files
        run: python -m compileall backend

      - name: Run backend tests if present
        shell: bash
        run: |
          set -euo pipefail
          if find backend -type f \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            python -m pytest backend --cov=backend --cov-report=xml:backend/coverage.xml
          else
            echo "No backend tests found; skipping pytest."
          fi

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  data-pipeline:
    name: Data pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data_pipeline/requirements-dev.txt

      - name: Install data pipeline dependencies
        run: python -m pip install requests python-dotenv xarray numpy netCDF4 -r data_pipeline/requirements-dev.txt

      - name: Compile data pipeline Python files
        run: python -m compileall data_pipeline

      - name: Run data pipeline tests if present
        shell: bash
        run: |
          set -euo pipefail
          if find data_pipeline -type f \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            python -m pytest data_pipeline --cov=data_pipeline/scripts --cov-report=xml:data_pipeline/coverage.xml
          else
            echo "No data pipeline tests found; skipping pytest."
          fi

      - name: Upload data pipeline coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-pipeline-coverage
          path: data_pipeline/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend UI tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs:
      - repository-safety
      - backend
      - data-pipeline
      - frontend
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || secrets.SONAR_PROJECT_KEY || github.event.repository.name }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || secrets.SONAR_ORGANIZATION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend

      - name: Download data pipeline coverage
        uses: actions/download-artifact@v4
        with:
          name: data-pipeline-coverage
          path: data_pipeline

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Skip SonarQube scan when token is missing
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN is not configured; skipping SonarQube analysis."

      - name: Run SonarQube Cloud scan
        # The SonarScanner CLI's JRE-provisioning call is occasionally flaky and
        # fails the step transiently. Don't let that break the whole CI run; the
        # SonarCloud Quality Gate is reported as its own status check and updates
        # whenever a scan succeeds.
        continue-on-error: true
        if: env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != ''
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
