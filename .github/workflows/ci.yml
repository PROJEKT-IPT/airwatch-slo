name: CI

on:
  push:
  pull_request:

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check forbidden tracked files
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env must not be tracked"
            exit 1
          fi

          forbidden_files="$(git ls-files '*.nc' 'data/**/*.zip' 'data/**/*.tif' 'data/**/*.tiff' 'data/**/*.h5' 'data_pipeline/**/*.zip' 'data_pipeline/**/*.tif' 'data_pipeline/**/*.tiff' 'data_pipeline/**/*.h5')"
          if [ -n "$forbidden_files" ]; then
            echo "::error::Forbidden large data files are tracked:"
            echo "$forbidden_files"
            exit 1
          fi

          echo "Repository safety checks passed."

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Compile backend Python files
        run: python -m compileall backend

      - name: Run backend tests if present
        shell: bash
        run: |
          set -euo pipefail
          if find backend -type f \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            python -m pytest backend
          else
            echo "No backend tests found; skipping pytest."
          fi

  data-pipeline:
    name: Data pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install data pipeline dependencies
        run: python -m pip install requests python-dotenv xarray numpy netCDF4

      - name: Compile data pipeline Python files
        run: python -m compileall data_pipeline

      - name: Run data pipeline tests if present
        shell: bash
        run: |
          set -euo pipefail
          if find data_pipeline -type f \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            python -m pip install pytest
            python -m pytest data_pipeline
          else
            echo "No data pipeline tests found; skipping pytest."
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint if present
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          if npm run | grep -qE '^  lint'; then
            npm run lint
          else
            echo "No frontend lint script found; skipping lint."
          fi

      - name: Build frontend
        working-directory: frontend
        run: npm run build
